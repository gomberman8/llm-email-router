[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "BLE", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"eval/dataset.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["llm: requires a running LLM model or full application stack"]
addopts = "-m 'not llm'"
