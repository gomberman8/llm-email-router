services:
  api:
    build: .
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b-instruct}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=${MAIL_FROM:-router@example.com}
      - DEPARTMENT_DOMAIN=${DEPARTMENT_DOMAIN:-example.com}
      - MAX_MESSAGE_CHARS=${MAX_MESSAGE_CHARS:-4000}
      - MAX_CONCURRENT_RUNS=${MAX_CONCURRENT_RUNS:-2}
      - RETRY_AFTER_SECONDS=${RETRY_AFTER_SECONDS:-10}
      - AGENT_RETRIES=${AGENT_RETRIES:-1}
      - WARMUP_ON_STARTUP=${WARMUP_ON_STARTUP:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.5
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.32.5
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b-instruct}
    volumes:
      - ./docker/ollama-init.sh:/usr/local/bin/ollama-init.sh:ro,z
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-init.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  tests:
    build:
      context: .
      target: dev
    volumes:
      - .:/app:z
    environment:
      - PYTHONUNBUFFERED=1
      - WARMUP_ON_STARTUP=false
      - ROUTER_URL=http://api:8000/api/v1/route
      - MAILPIT_BASE=http://mailpit:8025
    command: pytest -q
    profiles:
      - test

volumes:
  ollama-models:
